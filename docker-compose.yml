services:

  # ── Aplikasi PHP + Apache ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dprd_signage_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Environment CI4
      CI_ENVIRONMENT: production
      # Database — merujuk ke service "db" di bawah
      database.default.hostname: db
      database.default.database: dprd_signage
      database.default.username: dprd_user
      database.default.password: ${DB_PASSWORD}
      database.default.DBDriver: MySQLi
      # App URL
      app.baseURL: ${APP_BASE_URL}
      app.CSPEnabled: ${APP_CSP_ENABLED:-true}
      securityHeaders.hstsEnabled: ${SECURITY_HSTS_ENABLED:-true}
      securityHeaders.hstsMaxAge: ${SECURITY_HSTS_MAX_AGE:-31536000}
      securityHeaders.hstsIncludeSubDomains: ${SECURITY_HSTS_INCLUDE_SUBDOMAINS:-false}
      securityHeaders.hstsPreload: ${SECURITY_HSTS_PRELOAD:-false}
      securityHeaders.trustForwardedProto: ${SECURITY_TRUST_FORWARDED_PROTO:-false}
      # BMKG
      BMKG_ADM4: ${BMKG_ADM4:-72.71.01.1004}
      # OTP WhatsApp anggota melalui Fazpass
      OTP_PROVIDER: ${OTP_PROVIDER:-fazpass}
      FAZPASS_API_URL: ${FAZPASS_API_URL:-https://api.fazpass.com}
      FAZPASS_API_PREFIX: ${FAZPASS_API_PREFIX:-/v1}
      FAZPASS_MERCHANT_KEY: ${FAZPASS_MERCHANT_KEY:-}
      FAZPASS_GATEWAY_KEY: ${FAZPASS_GATEWAY_KEY:-}
      FAZPASS_CALLBACK_SECRET: ${FAZPASS_CALLBACK_SECRET:-}
      FAZPASS_TIMEOUT_SECONDS: ${FAZPASS_TIMEOUT_SECONDS:-15}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_CHALLENGE_TTL_SECONDS: ${OTP_CHALLENGE_TTL_SECONDS:-900}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_REQUEST_WINDOW_SECONDS: ${OTP_REQUEST_WINDOW_SECONDS:-3600}
      OTP_MAX_REQUESTS_PER_PHONE: ${OTP_MAX_REQUESTS_PER_PHONE:-5}
      OTP_MAX_REQUESTS_PER_IP: ${OTP_MAX_REQUESTS_PER_IP:-100}
      OTP_DAILY_WINDOW_SECONDS: ${OTP_DAILY_WINDOW_SECONDS:-86400}
      OTP_MAX_REQUESTS_PER_ACCOUNT_PER_DAY: ${OTP_MAX_REQUESTS_PER_ACCOUNT_PER_DAY:-10}
      OTP_GLOBAL_WINDOW_SECONDS: ${OTP_GLOBAL_WINDOW_SECONDS:-3600}
      OTP_MAX_REQUESTS_GLOBAL: ${OTP_MAX_REQUESTS_GLOBAL:-100}
      OTP_MAX_REQUESTS_GLOBAL_PER_DAY: ${OTP_MAX_REQUESTS_GLOBAL_PER_DAY:-300}
      OTP_MAX_VERIFICATION_ATTEMPTS: ${OTP_MAX_VERIFICATION_ATTEMPTS:-5}
    volumes:
      # Persist data upload & log — tidak hilang saat container restart
      - uploads_data:/var/www/html/public/uploads
      - writable_data:/var/www/html/writable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dprd_net

  # ── Database MySQL / MariaDB ─────────────────────────────────────
  db:
    image: mariadb:11
    container_name: dprd_signage_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: dprd_signage
      MYSQL_USER: dprd_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Makassar
    volumes:
      # Persist data database
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dprd_net

  # ── phpMyAdmin (opsional — bisa dihapus di production) ──────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dprd_signage_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: dprd_user
      PMA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - dprd_net
    profiles:
      - tools   # hanya aktif dengan: docker compose --profile tools up

# ── Volumes ──────────────────────────────────────────────────────
volumes:
  db_data:
  uploads_data:
  writable_data:

# ── Networks ─────────────────────────────────────────────────────
networks:
  dprd_net:
    driver: bridge
